<!DOCTYPE html>
<html lang="vi">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>Ứng dụng Quản lý Sản phẩm - PaaS Demo</title>
				<style>
					body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 0 20px; }
					h1 { color: #333; text-align: center; }
					.form-group { margin-bottom: 15px; }
					input { padding: 8px; width: calc(50% - 12px); margin-right: 5px; }
					button { padding: 8px 15px; background: #28a745; color: white; border: none; cursor: pointer; }
					button.delete { background: #dc3545; padding: 4px 8px; float: right; }
					ul { list-style: none; padding: 0; }
					li { background: #f4f4f4; margin: 8px 0; padding: 10px; border-radius: 4px; }
				</style>
			</head>
	<body>
		<h1>Quản lý Sản phẩm</h1>

		<div class="form-group">
			<input type="text" id="name" placeholder="Tên sản phẩm">
				<input type="number" id="price" placeholder="Giá (VNĐ)">
					<button onclick="addProduct()">Thêm</button>
				</div>

		<ul id="productList"></ul>

		<script>
			async function fetchProducts() {
			const res = await fetch('/api/products');
			const products = await res.json();
			const list = document.getElementById('productList');
			list.innerHTML = '';
			products.forEach(p => {
			list.innerHTML += `
			<li>
				<b>${p.name}</b> - ${Number(p.price).toLocaleString()} VNĐ
				<button class="delete" onclick="deleteProduct(${p.id})">Xóa</button>
			</li>
			`;
			});
			}

			async function addProduct() {
			const name = document.getElementById('name').value;
			const price = document.getElementById('price').value;
			if (!name || !price) return alert('Vui lòng nhập đủ thông tin');

			await fetch('/api/products', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ name, price })
			});

			document.getElementById('name').value = '';
			document.getElementById('price').value = '';
			fetchProducts();
			}

			async function deleteProduct(id) {
			await fetch(`/api/products/${id}`, { method: 'DELETE' });
			fetchProducts();
			}

			fetchProducts();
		</script>
	</body>
</html>
